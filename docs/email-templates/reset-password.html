<!--
  Supabase Dashboard → Authentication → Emails → Reset Password に貼る本文。
  件名: 【Glog】パスワード再設定のご案内
-->
<div style="margin:0;padding:24px 16px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#18181b;">
  <div style="max-width:480px;margin:0 auto;padding:32px 24px;background:#ffffff;border-radius:16px;">
    <p style="margin:0 0 24px;font-size:24px;font-weight:700;letter-spacing:-0.02em;">Glog</p>
    <h1 style="margin:0 0 16px;font-size:18px;font-weight:600;">パスワードの再設定</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.7;">
      {{ .Email }} のアカウントで、パスワード再設定のリクエストを受け付けました。<br>
      下のボタンを押して、新しいパスワードを設定してください。
    </p>
    <p style="margin:0 0 24px;text-align:center;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 32px;background:#E8412F;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;border-radius:12px;">新しいパスワードを設定する</a>
    </p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#52525b;">
      ボタンが押せない場合は、次のURLをブラウザで開いてください。
    </p>
    <p style="margin:0 0 24px;font-size:12px;line-height:1.6;word-break:break-all;color:#52525b;">
      {{ .ConfirmationURL }}
    </p>
    <p style="margin:0;padding-top:16px;border-top:1px solid #e4e4e7;font-size:13px;line-height:1.7;color:#52525b;">
      このリンクは一度だけ使え、時間がたつと無効になります。無効になった場合は、ログイン画面の「パスワードを忘れた方」からもう一度お送りください。<br>
      心当たりがない場合は、このメールを無視してください。パスワードは変更されません。
    </p>
  </div>
</div>
